name: Sync upstream

# 每天自动从官网仓库 roseforyou/cf-outlook-email 拉取更新。
# 规则：
#   - 干净合并 + 类型检查 + 单元测试全过  → 推 main（线上 Docker 需人工重建后才生效）
#   - 有冲突，或自检不过                  → 一律不推，只把冲突详情写进运行日志和 job summary
on:
  schedule:
    # UTC 18:23 = 北京时间次日 02:23
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.sync.outputs.state }}
      sha: ${{ steps.sync.outputs.sha }}
      behind: ${{ steps.sync.outputs.behind }}
      conflicts: ${{ steps.sync.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # 版本来自 package.json 的 packageManager，不要再写 version:，
      # 否则 pnpm/action-setup 报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v6

      # 不开 pnpm 缓存：官网没更新时这个 job 根本不会跑 pnpm install，
      # 缓存保存阶段找不到 store 目录会把整个 run 标成失败。
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 配置提交身份
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # state 取值：uptodate / ready / conflict / verify-failed
      - name: 合并官网更新并自检
        id: sync
        run: |
          state=uptodate
          sha=""
          conflicts=""

          git remote add upstream https://github.com/roseforyou/cf-outlook-email.git
          git fetch --quiet upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "官网领先本仓库 ${behind} 个提交"

          if [ "$behind" -gt 0 ]; then
            git log --oneline --no-decorate HEAD..upstream/main
            if git merge --no-edit upstream/main; then
              # 自检不需要任何 Cloudflare 凭据：build 是 tsc --noEmit，test 是 vitest。
              if pnpm install --no-frozen-lockfile && pnpm run build && pnpm run test; then
                state=ready
                sha=$(git rev-parse HEAD)
              else
                state=verify-failed
              fi
            else
              conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              git merge --abort || true
              state=conflict
            fi
          fi

          echo "结果：${state}"
          {
            echo "state=${state}"
            echo "sha=${sha}"
            echo "behind=${behind}"
            echo "conflicts=${conflicts}"
          } >> "$GITHUB_OUTPUT"

      - name: 推送到 main
        if: steps.sync.outputs.state == 'ready'
        run: git push origin main

      # 冲突或自检失败时，生产环境完全不动，只把详情写进运行日志和 job summary。
      # 不开 Issue：本仓库 Issues 是关着的，gh issue create 会直接把 run 标红。
      - name: 需要人工处理 → 记录日志
        if: steps.sync.outputs.state == 'conflict' || steps.sync.outputs.state == 'verify-failed'
        env:
          STATE: ${{ steps.sync.outputs.state }}
          BEHIND: ${{ steps.sync.outputs.behind }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          if [ "$STATE" = "conflict" ]; then
            reason="合并官网更新时发生冲突"
            conflicts="${CONFLICTS:-未记录}"
          else
            reason='官网更新能干净合并，但类型检查或单元测试没通过'
            conflicts=''
          fi

          echo "::warning::${reason}：官网领先本仓库 ${BEHIND} 个提交，等待人工合并"
          if [ -n "$conflicts" ]; then
            for file in $conflicts; do
              echo "::warning::冲突文件：$file"
            done
          fi

          {
            echo "## 官网更新需要人工合并"
            echo
            echo "- 状态：\`${STATE}\`"
            echo "- 官网领先本仓库：**${BEHIND}** 个提交"
            echo "- 原因：${reason}"
            echo "- 冲突文件：\`${conflicts:-（无）}\`"
            echo
            echo "生产环境未做任何改动，线上仍是上一个已验证版本。"
            echo "处理办法：本地 \`git fetch upstream && git merge upstream/main\`，解完冲突后推送。"
          } >> "$GITHUB_STEP_SUMMARY"
